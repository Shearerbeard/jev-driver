[package]
name = "jev-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust driver for TypeSafe AI's Jev (System One) decision model"
keywords = ["jev", "typesafe", "decision", "llm", "ai"]
categories = ["api-bindings", "development-tools"]
readme = "../README.md"

[features]
default = ["dotenv", "native-tls", "json-preserve-order"]
test-support = []
dotenv = ["dep:dotenvy"]
json-preserve-order = ["serde_json/preserve_order"]

# TLS backend for the HTTP client. `native-tls` is reqwest's default backend;
# `rustls-tls` avoids the OpenSSL dependency (static and cross builds).
# Build with `default-features = false` and pick one.
native-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true, optional = true }
jev-driver-macros = { path = "../jev-driver-macros", version = "=0.1.0" }

[dev-dependencies]
jev-driver = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
trybuild = { workspace = true }

[lints]
workspace = true
