# License allow-list verified green against the full dependency tree
# (cargo deny check: advisories, bans, licenses, sources all ok,
# 2026-10-02). Re-run after any dependency bump.
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "MIT-0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
